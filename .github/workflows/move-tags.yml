name: Move tags to rewritten commits

# One-off maintenance after the history rewrite of 2026-11-23: every v* tag that no longer sits on main is
# moved to its twin on main (same tree, same author date, same subject). Tags pushed with GITHUB_TOKEN don't
# start other workflows, so the releases are not rebuilt.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Move each v* tag to its twin on main
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          for t in $(git tag -l 'v*'); do
            old=$(git rev-parse "$t^{commit}")
            if git merge-base --is-ancestor "$old" origin/main; then
              echo "$t is already on main ($old)" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            tree=$(git rev-parse "$old^{tree}")
            date=$(git log -1 --format=%at "$old")
            subject=$(git log -1 --format=%s "$old")
            new=""
            for c in $(git log origin/main --format=%H); do
              if [ "$(git rev-parse "$c^{tree}")" = "$tree" ] && [ "$(git log -1 --format=%at "$c")" = "$date" ] \
                && [ "$(git log -1 --format=%s "$c")" = "$subject" ]; then
                new=$c
                break
              fi
            done
            if [ -z "$new" ]; then
              echo "::error::No commit on main matches $t ($old); left as it is."
              exit 1
            fi
            git tag -f "$t" "$new"
            git push --force origin "refs/tags/$t"
            echo "$t: $old -> $new" | tee -a "$GITHUB_STEP_SUMMARY"
          done
