name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the GitHub release v<versionName> from this commit (instead of pushing a tag)"
        type: boolean
        default: false

permissions:
  contents: write # only used to publish a release (a pushed v* tag, or a manual run with "release")

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version} in app/build.gradle.kts. Bump the version, commit, then tag v<versionName>."
            exit 1
          fi

      - name: Check that a manual release is new
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases are only published from main."
            exit 1
          fi
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" > /dev/null; then
            echo "::error::v${version} already exists. Bump versionName and versionCode, commit, then run again."
            exit 1
          fi
          echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=fastlane/metadata/android/en-US/changelogs/${code}.txt" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Fails on missing German translations and other errors (CLAUDE.md: must have none).
      - name: Lint
        run: |
          ./gradlew :app:lintDebug --console=plain || {
            grep -A4 ": Error:" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
            exit 1
          }

      - name: Lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      # Signed with your own key when the CASTAPP_* secrets exist (see README),
      # otherwise with the key committed in the repository.
      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.CASTAPP_KEYSTORE_BASE64 }}
          CASTAPP_KEYSTORE_PASSWORD: ${{ secrets.CASTAPP_KEYSTORE_PASSWORD }}
          CASTAPP_KEY_ALIAS: ${{ secrets.CASTAPP_KEY_ALIAS }}
          CASTAPP_KEY_PASSWORD: ${{ secrets.CASTAPP_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/castapp-release.jks"
            export CASTAPP_KEYSTORE_FILE="$RUNNER_TEMP/castapp-release.jks"
            echo "Signing with the key from the repository secrets."
          else
            echo "No signing secrets set: signing with the committed key."
          fi
          ./gradlew assembleRelease --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk CastApp.apk
          cp wear/build/outputs/apk/release/wear-release.apk CastApp-wear.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp
          path: CastApp.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp-wear
          path: CastApp-wear.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CastApp.apk
            CastApp-wear.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      # A manual run with "release": creates the tag v<versionName> on this commit and the release.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CastApp ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES }}
          files: |
            CastApp.apk
            CastApp-wear.apk
          generate_release_notes: true
          draft: false
          prerelease: false
