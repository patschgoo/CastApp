name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew assembleRelease --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk CastApp.apk
          cp wear/build/outputs/apk/release/wear-release.apk CastApp-wear.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp
          path: CastApp.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp-wear
          path: CastApp-wear.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CastApp.apk
            CastApp-wear.apk
