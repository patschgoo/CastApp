name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a release when a v* tag is pushed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${version} in app/build.gradle.kts. Bump the version, commit, then tag v<versionName>."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      # Signed with your own key when the CASTAPP_* secrets exist (see README),
      # otherwise with the key committed in the repository.
      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.CASTAPP_KEYSTORE_BASE64 }}
          CASTAPP_KEYSTORE_PASSWORD: ${{ secrets.CASTAPP_KEYSTORE_PASSWORD }}
          CASTAPP_KEY_ALIAS: ${{ secrets.CASTAPP_KEY_ALIAS }}
          CASTAPP_KEY_PASSWORD: ${{ secrets.CASTAPP_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/castapp-release.jks"
            export CASTAPP_KEYSTORE_FILE="$RUNNER_TEMP/castapp-release.jks"
            echo "Signing with the key from the repository secrets."
          else
            echo "No signing secrets set: signing with the committed key."
          fi
          ./gradlew assembleRelease --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk CastApp.apk
          cp wear/build/outputs/apk/release/wear-release.apk CastApp-wear.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp
          path: CastApp.apk

      - uses: actions/upload-artifact@v7
        with:
          name: CastApp-wear
          path: CastApp-wear.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CastApp.apk
            CastApp-wear.apk
          generate_release_notes: true
          draft: false
          prerelease: false
