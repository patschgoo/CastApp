<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CastApp TV player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #msg { position: absolute; left: 5%; bottom: 7%; color: #bbb; font: 28px/1.3 Roboto, sans-serif; text-shadow: 0 0 6px #000; }
  #msg.hidden { display: none; }
</style>
<!-- Google's Cast receiver framework. Missing when the page is opened in a normal browser (test mode). -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<video id="v" autoplay playsinline></video>
<div id="msg">CastApp — waiting for the phone…</div>
<script>
'use strict';
/*
 * CastApp low-latency TV player.
 *
 * The phone sends {type: "PLAY", url, codecs} on our own namespace. We fetch the
 * live fragmented-MP4 stream and feed it to Media Source Extensions ourselves,
 * keeping only a few hundred milliseconds buffered: when playback falls behind
 * we speed up a little, and if it falls far behind we jump to the live edge.
 *
 * The stream is H.264 ("avc1...") or HEVC ("hvc1..."). Before sending HEVC the phone
 * asks {type: "CAPS", codecs} and we answer whether this TV can play it; phones
 * that get no answer (an older copy of this page) stay on H.264.
 *
 * Test in a desktop browser: index.html?test=<stream url>&codecs=avc1.64001F,mp4a.40.2
 * (HEVC: codecs=hvc1.1.6.L93.90,mp4a.40.2)
 */
const NS = 'urn:x-cast:io.github.patschgoo.castapp';
const TARGET_LAG = 0.2;   // seconds of buffer we aim for
const CATCH_UP_LAG = 0.3; // above this, play 10% faster
const JUMP_LAG = 1.2;     // above this, jump to the live edge
const video = document.getElementById('v');
const msg = document.getElementById('msg');
let ctx = null;
let player = null;

/** True if this TV can play an MP4 stream with these codecs (MSE, then Cast's own check). */
function canPlay(codecs) {
  const type = 'video/mp4; codecs="' + codecs + '"';
  if (!window.MediaSource || !MediaSource.isTypeSupported(type)) return false;
  if (ctx && typeof ctx.canDisplayType === 'function') {
    const v = codecs.split(',').map(c => c.trim()).find(c => /^(avc1|avc3|hvc1|hev1)\./.test(c));
    try { if (v && !ctx.canDisplayType('video/mp4', v)) return false; } catch (_) {}
  }
  return true;
}

function show(text) { msg.textContent = text; msg.classList.toggle('hidden', !text); }

class LowLatencyPlayer {
  constructor(url, codecs, onState) {
    this.url = url;
    this.codecs = codecs;
    this.onState = onState;
    this.queue = [];
    this.running = false;
    this.lastState = '';
  }

  async start() {
    const type = 'video/mp4; codecs="' + this.codecs + '"';
    if (!canPlay(this.codecs)) throw new Error('Unsupported stream: ' + type);
    this.ms = new MediaSource();
    video.src = URL.createObjectURL(this.ms);
    await new Promise(resolve => this.ms.addEventListener('sourceopen', resolve, { once: true }));
    this.sb = this.ms.addSourceBuffer(type);
    this.sb.mode = 'segments';
    this.sb.addEventListener('updateend', () => this.pump());
    this.running = true;
    this.timer = setInterval(() => this.tick(), 200);
    this.fetchLoop();
  }

  async fetchLoop() {
    try {
      this.abort = new AbortController();
      const res = await fetch(this.url, { signal: this.abort.signal, cache: 'no-store' });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      while (this.running) {
        const { value, done } = await reader.read();
        if (done) break;
        this.queue.push(value);
        this.pump();
      }
      if (this.running) this.state('error', 'The phone stopped sending');
    } catch (e) {
      if (this.running) this.state('error', String(e && e.message || e));
    }
  }

  pump() {
    if (!this.sb || this.sb.updating || this.queue.length === 0) return;
    let total = 0;
    for (const c of this.queue) total += c.byteLength;
    const data = new Uint8Array(total);
    let offset = 0;
    for (const c of this.queue) { data.set(c, offset); offset += c.byteLength; }
    this.queue = [];
    try {
      this.sb.appendBuffer(data);
    } catch (e) {
      if (e.name === 'QuotaExceededError') {
        this.queue.unshift(data);
        this.trim(true);
      } else {
        this.state('error', e.message);
      }
    }
  }

  tick() {
    const b = video.buffered;
    if (!b.length) { this.state('buffering'); return; }
    const end = b.end(b.length - 1);
    const lag = end - video.currentTime;
    if (video.currentTime < b.start(b.length - 1) || lag > JUMP_LAG) {
      video.currentTime = Math.max(b.start(b.length - 1), end - TARGET_LAG);
    } else if (lag > CATCH_UP_LAG) {
      video.playbackRate = 1.1;
    } else if (lag < TARGET_LAG / 2) {
      video.playbackRate = 0.97;
    } else {
      video.playbackRate = 1.0;
    }
    if (video.paused) video.play().catch(() => {});
    this.trim(false);
    this.state(video.paused ? 'buffering' : 'playing');
    window.lastLag = lag; // for testing
  }

  trim(force) {
    if (!this.sb || this.sb.updating) return;
    const b = this.sb.buffered;
    if (b.length && (force || video.currentTime - b.start(0) > 20)) {
      try { this.sb.remove(0, Math.max(0.1, video.currentTime - 5)); } catch (_) {}
    }
  }

  state(s, message) {
    if (s === this.lastState && !message) return;
    this.lastState = s;
    show(s === 'playing' ? '' : s === 'error' ? 'Problem: ' + message : 'Starting…');
    this.onState(s, message);
  }

  stop() {
    this.running = false;
    clearInterval(this.timer);
    try { this.abort && this.abort.abort(); } catch (_) {}
    try { if (this.ms && this.ms.readyState === 'open') this.ms.endOfStream(); } catch (_) {}
    video.removeAttribute('src');
    video.load();
  }
}

function send(senderId, data) {
  if (ctx && senderId) ctx.sendCustomMessage(NS, senderId, data);
  else console.log('to phone:', JSON.stringify(data));
}

function handle(data, senderId) {
  if (!data) return;
  if (data.type === 'CAPS') {
    const codecs = String(data.codecs || '');
    send(senderId, {
      type: 'CAPS',
      requestId: data.requestId,
      supported: codecs ? canPlay(codecs) : false,
      hevc: canPlay('hvc1.1.6.L120.90'),
    });
  } else if (data.type === 'PLAY') {
    if (player) player.stop();
    player = new LowLatencyPlayer(data.url, data.codecs || 'avc1.42E01F,mp4a.40.2',
      (state, message) => send(senderId, { type: 'STATUS', state: state, message: message || '' }));
    player.start()
      .then(() => send(senderId, { type: 'STATUS', state: 'started', requestId: data.requestId }))
      .catch(e => send(senderId, { type: 'STATUS', state: 'error', message: String(e && e.message || e), requestId: data.requestId }));
  } else if (data.type === 'STOP') {
    if (player) player.stop();
    player = null;
    show('CastApp — waiting for the phone…');
  }
}

const testUrl = new URLSearchParams(location.search).get('test');
if (testUrl) {
  // Desktop test mode: play the given stream directly.
  handle({ type: 'PLAY', url: testUrl, codecs: new URLSearchParams(location.search).get('codecs'), requestId: 0 }, null);
} else if (window.cast && cast.framework) {
  ctx = cast.framework.CastReceiverContext.getInstance();
  ctx.addCustomMessageListener(NS, e => handle(e.data, e.senderId));
  const options = new cast.framework.CastReceiverOptions();
  options.disableIdleTimeout = true;
  options.skipPlayersLoad = true;
  options.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
  ctx.start(options);
} else {
  show('CastApp TV player — open it from the app (or add ?test=<stream url> to try it here).');
}
</script>
</body>
</html>
